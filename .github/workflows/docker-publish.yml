name: Docker publish

# Publishes a container image to ghcr.io on every release-track event.
#
# - push to `release` → publishes `:release-edge` and `:sha-<short>`
#   (this is the staging build that follows main into release; users who
#   want "what is about to ship" pull this tag)
# - tag `v*`          → publishes the version tag (e.g. `:0.3.3`) plus
#   `:latest`. Not a trigger of its own: release.yml calls this workflow
#   (`workflow_call`) twice - `stage: build` alongside the binary builds,
#   `stage: promote` only after every artefact of the release succeeded -
#   so no public tag moves while a tarball or the other image is failing.
# - manual dispatch   → publishes the user-provided tag (defaults to the
#   short SHA), useful for back-publishing a stable image for a code state
#   that has already shipped under crates.io / brew.
#
# Pushes to feature branches and to `main` do NOT trigger an image
# publish. Iteration on main happens via the CI workflow alone; the
# Docker layer is intentionally gated to the release track to keep
# ghcr storage tidy and avoid noise on the public image listing.
on:
  workflow_call:
    inputs:
      gated:
        description: 'Caller already ran fmt/clippy/test on this commit; skip the local gate.'
        required: false
        type: boolean
        default: false
      dry_run:
        description: 'Build both architectures but push nothing.'
        required: false
        type: boolean
        default: false
      scratch_tag:
        description: >-
          When set, the promote stage binds the digests under this ONE tag
          and nothing else - used by release.yml's validate-promote run,
          which deletes the tag afterwards. Never :latest, never a version.
        required: false
        type: string
        default: ''
      stage:
        description: >-
          all: build, then tag (the standalone behaviour). build: push the
          per-architecture images by digest only - untagged candidates, not
          reachable by any public tag - and upload their digests as run
          artifacts. promote: skip the build and bind the digests uploaded
          earlier in this run under the real tags. release.yml calls build
          and promote separately so no tag moves before every artefact of
          the release succeeded.
        required: false
        type: string
        default: all
  push:
    branches: [release]
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/docker-publish.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to publish (e.g. 0.1.1). Defaults to short SHA.'
        required: false
        type: string
      also_latest:
        description: 'Also push to :latest'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Duplicated from release.yml's `guard` job: workflows cannot depend on
  # jobs in another workflow, so the ancestry check has to be repeated here
  # too. Without it, a tag rejected by release.yml (not reachable from
  # `release`) could still reach this workflow via its own `tags: ['v*']`
  # trigger and publish `:<version>` / `:latest` to ghcr.io.
  # Every manual dispatch publishes something (a custom tag and `sha-*` at
  # least), so its ref gets the same check. On `release` pushes and dry runs
  # this job is a no-op that still succeeds, so `needs: guard` resolves to
  # "ok".
  guard:
    runs-on: ubuntu-latest
    env:
      CHECK: ${{ (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') && !inputs.dry_run }}
    steps:
      - uses: actions/checkout@v5
        if: env.CHECK == 'true'
        with:
          fetch-depth: 0
      - name: ref must be reachable from origin/release
        if: env.CHECK == 'true'
        run: |
          set -e
          git fetch origin release:refs/remotes/origin/release
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/release; then
            echo "::error::${{ github.ref_name }} (commit $GITHUB_SHA) is not reachable from origin/release"
            exit 1
          fi
          echo "ok: ref reachable from release"

  # Same gate as release.yml's `test` job (duplicated for the same reason as
  # `guard`): an image is a shipped artefact like a crate, so nothing is
  # pushed to ghcr.io - `:<version>`, `:latest`, `:release-edge`, or a manual
  # tag - unless fmt, clippy and the workspace suite are green on this commit.
  # `release` gets no ci.yml run of its own, so this is the only test gate
  # `release-edge` ever sees. Skipped when release.yml calls in with
  # `gated: true`: it has just run the identical job on the same commit.
  test:
    if: ${{ !inputs.gated }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: cargo test
        run: cargo test --workspace --release --locked -- --test-threads=1

  # Tags are derived once and shared: the per-architecture builds push by
  # digest and carry no tags of their own, so a half-finished matrix can
  # never leave a tag pointing at one architecture.
  meta:
    runs-on: ubuntu-latest
    outputs:
      tags: ${{ steps.meta.outputs.tags }}
    steps:
      - name: derive tags
        id: meta
        run: |
          SHA_SHORT="${GITHUB_SHA::7}"
          REF="${GITHUB_REF}"
          if [ -n "${{ inputs.scratch_tag }}" ]; then
            # validate-promote: one throwaway tag, deleted by the caller.
            TAGS="ghcr.io/skegdb/skeg:${{ inputs.scratch_tag }}"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -z "${{ inputs.stage }}" ]; then
            INPUT_TAG="${{ github.event.inputs.tag }}"
            PRIMARY="${INPUT_TAG:-$SHA_SHORT}"
            TAGS="ghcr.io/skegdb/skeg:${PRIMARY}\nghcr.io/skegdb/skeg:sha-${SHA_SHORT}"
            if [ "${{ github.event.inputs.also_latest }}" = "true" ]; then
              TAGS="${TAGS}\nghcr.io/skegdb/skeg:latest"
            fi
          elif [[ "${REF}" == refs/tags/v* ]]; then
            # Release tag: strip the leading `v` so the image tag is
            # `0.3.3` (matching crates.io / brew). `:latest` follows only a
            # final version: a pre-release (`0.8.0-rc.1`, anything with a
            # `-`) must not move what `docker pull skeg` gives everyone.
            VERSION="${REF#refs/tags/v}"
            TAGS="ghcr.io/skegdb/skeg:${VERSION}\nghcr.io/skegdb/skeg:sha-${SHA_SHORT}"
            case "$VERSION" in
              *-*) echo "pre-release ${VERSION}: not moving :latest" ;;
              *)   TAGS="${TAGS}\nghcr.io/skegdb/skeg:latest" ;;
            esac
          else
            # Push to the `release` branch: staging-edge build.
            TAGS="ghcr.io/skegdb/skeg:release-edge\nghcr.io/skegdb/skeg:sha-${SHA_SHORT}"
          fi
          {
            echo "tags<<EOF"
            printf "%b\n" "$TAGS"
            echo EOF
          } >> "$GITHUB_OUTPUT"

  # One native runner per architecture: cross-building Rust under QEMU turns a
  # few minutes into the better part of an hour.
  build:
    needs: [meta, guard, test]
    # `test` may be skipped (gated caller); anything else short of success
    # upstream still blocks the build.
    if: ${{ !cancelled() && inputs.stage != 'promote' && needs.meta.result == 'success' && needs.guard.result == 'success' && needs.test.result != 'failure' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/arm64
            runner: ubuntu-22.04-arm
            build_args: ""
          - platform: linux/amd64
            runner: ubuntu-latest
            # The amd64 image carries the AVX-512 kernels. They are chosen at
            # runtime only where the CPU has them, so this image still runs on
            # any x86_64 machine; compiling them is what needs 1.89. On arm64
            # the feature compiles to nothing, so it is not passed there.
            build_args: |
              RUST_VERSION=1.89
              CARGO_FEATURES=avx512
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: ${{ matrix.build_args }}
          outputs: type=image,name=ghcr.io/skegdb/skeg,push-by-digest=true,name-canonical=true,push=${{ !inputs.dry_run }}
          labels: |
            org.opencontainers.image.source=https://github.com/skegdb/skeg
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.description=Vector + KV store, SSD-primary, RAM-frugal.
      - name: export digest
        if: ${{ !inputs.dry_run }}
        run: |
          mkdir -p /tmp/digests
          # Bare hex: upload-artifact rejects a path containing the `:` of
          # `sha256:`, and `merge` puts the prefix back when it builds the ref.
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v5
        if: ${{ !inputs.dry_run }}
        with:
          name: digest-${{ strategy.job-index }}
          path: /tmp/digests/*
          retention-days: 1

  # Bind both architectures under the real tags, so `docker pull ghcr.io/
  # skegdb/skeg:0.7.1` resolves to arm64 or amd64 by itself.
  merge:
    needs: [meta, guard, build]
    # `build` is skipped on `stage: promote` (its digests were uploaded by
    # the `stage: build` call earlier in the same run); anything short of
    # success elsewhere still blocks the tags.
    if: ${{ !cancelled() && !inputs.dry_run && inputs.stage != 'build' && needs.meta.result == 'success' && needs.guard.result == 'success' && needs.build.result != 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: digest-*
          merge-multiple: true
          path: /tmp/digests
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: create the manifest list
        run: |
          cd /tmp/digests
          refs=""
          for d in *; do refs="$refs ghcr.io/skegdb/skeg@sha256:$d"; done
          # shellcheck disable=SC2086
          while read -r tag; do
            [ -n "$tag" ] || continue
            docker buildx imagetools create --tag "$tag" $refs
          done <<< "${{ needs.meta.outputs.tags }}"
      - name: report what was published
        run: |
          while read -r tag; do
            [ -n "$tag" ] || continue
            docker buildx imagetools inspect "$tag" | head -20
          done <<< "${{ needs.meta.outputs.tags }}"
