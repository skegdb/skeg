name: Release
on:
  push:
    tags: ['v*']
  # Manual runs are dry runs, always: they exercise guard, test, both
  # binary and image builds, and stop there. Publishing only happens from a
  # `v*` tag, because every promotion step (GitHub Release, image tags,
  # crates.io, Homebrew) is keyed on that tag name; a publishing dispatch
  # had no tag and would have shipped crates and images, then failed the
  # Homebrew bump looking for a Release that was never created.
  workflow_dispatch:

# Build, then promote. guard -> version-gate -> test -> {build-binaries, docker-build}
# produce nothing public: tarballs are run artifacts, images are pushed by
# digest only (untagged). Only once all of them succeeded does
# `promote-release` create the GitHub Release with every tarball, then
# `docker-promote` binds the digests under `:<version>` / `:latest`, then
# `publish-crates` (irreversible: crates.io), then `bump-homebrew`. A failed
# build of any one target therefore leaves nothing public behind. The
# promotion steps themselves are sequential and each is re-runnable, but a
# failure among them does leave the earlier ones visible.
# `scripts/check-release-graph.rb` asserts this shape.
#
# A manual run (workflow_dispatch) stops after the build jobs: nothing is
# promoted, so the pipeline can be validated on any branch without
# releasing. Candidate image digests are never pushed on a manual run; a
# tag run that fails before `docker-promote` does leave its untagged
# digests on ghcr.io (not reachable by tag; no automatic cleanup - the
# per-architecture digests under a promoted manifest look identical to
# GHCR, so a blind "delete untagged" would break shipped images).

# `contents: write` for GitHub Release artifact uploads.
# `packages: write` for pushing the container image to ghcr.io.
permissions:
  contents: write
  packages: write

jobs:
  guard:
    # Reject tags that do not point at a commit reachable from `release`.
    # Convention: only the `release` branch is rolled forward to a
    # publishable state; tags created elsewhere are mistakes.
    # A manual run publishes nothing, so this is a no-op there and the
    # downstream `needs: guard` still resolves to "ok".
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        if: github.event_name == 'push'
        with:
          fetch-depth: 0
      - name: tag must be reachable from origin/release
        if: github.event_name == 'push'
        run: |
          set -e
          git fetch origin release:refs/remotes/origin/release
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/release; then
            echo "::error::${{ github.ref_name }} (commit $GITHUB_SHA) is not reachable from origin/release"
            exit 1
          fi
          echo "ok: ref reachable from release"

  version-gate:
    # Every crate whose source changed since the previous tag must carry a
    # version that is not on crates.io yet. Without this, `cargo publish`
    # answers "already exists" for a changed-but-unbumped crate, the publish
    # job treats that as success, and the tag goes green without shipping
    # the code it just tested. Runs on manual dry runs too, so the answer is
    # known long before a tag exists. Same script as the local check.
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: changed crates carry unpublished versions
        run: python3 scripts/check-release-versions.py

  test:
    needs: [guard, version-gate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy
        # `--all-features` is stricter than the CI lint (it also compiles the
        # avx512, metrics-http, tracing-otlp and live-attach code); `--locked`
        # keeps it on the committed lockfile like every other gate here.
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: cargo test
        # `--release --locked` mirrors ci.yml. Serial because the parallel
        # workspace suite exhausted the file-descriptor budget locally
        # (EMFILE); lift once the suite owns its FD budget.
        run: cargo test --workspace --release --locked -- --test-threads=1

  publish-crates:
    if: github.event_name == 'push'
    needs: [promote-release, docker-promote]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history + tags needed to diff each crate against the
          # previous release and skip unchanged ones.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: publish changed crates in dep order
        # Per-crate versioning: each crate carries its own `version` and
        # is published only when its source tree changed since the
        # previous tag. Unchanged crates are skipped without invoking
        # `cargo publish` (avoids version-bump noise on crates.io when a
        # release touches only some crates).
        #
        # Failure modes still covered:
        # - First tag (no previous): every crate is published.
        # - Re-run of a partially-failed publish: the "already exists on
        #   crates.io index" branch skips crates this run already shipped.
        #   That branch is safe only because `version-gate` proved, before
        #   anything was published, that no changed crate was already on
        #   the index - so "already exists" here can only mean "published
        #   earlier in this run", never "forgot to bump". Re-run failed
        #   jobs, not the whole workflow: a fresh run would fail the gate
        #   on the crates the first run did ship.
        # NOT `--locked`: the committed Cargo.lock pins sibling crates to
        # their previous registry versions (pulled in transitively by
        # already-published deps), so a crate using a just-bumped sibling's
        # new API would verify against the OLD sibling and fail. Publishing
        # unlocked re-resolves each crate against the live index; the
        # `sleep 30` after each publish lets the new version propagate
        # before the next crate resolves it.
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -eo pipefail
          # Find the previous release tag (excluding HEAD). On the very
          # first release, `prev_tag` is empty and every crate publishes.
          prev_tag=$(git tag --sort=-creatordate | grep -E '^v[0-9]' | grep -v "^${GITHUB_REF_NAME}\$" | head -n 1 || true)
          if [ -n "$prev_tag" ]; then
            echo "diffing against previous tag: $prev_tag"
          else
            echo "no previous tag found; will publish every crate"
          fi
          for crate in skeg-proto skeg-simd skeg-platform skeg-telemetry skeg-resp3 skeg-core skeg-vector skeg-tenant skeg-server skeg-server-tenant skeg-multi-tenant; do
            echo "::group::publish $crate"
            if [ -n "$prev_tag" ] && git diff --quiet "$prev_tag" HEAD -- "crates/$crate"; then
              echo "$crate: no changes since $prev_tag, skipping cargo publish"
              echo "::endgroup::"
              continue
            fi
            if out=$(cd crates/$crate && cargo publish 2>&1); then
              echo "$out"
              sleep 30
            elif echo "$out" | grep -q "already exists on crates.io index"; then
              echo "$out"
              echo "$crate: already on crates.io, continuing"
            else
              echo "$out"
              exit 1
            fi
            echo "::endgroup::"
          done

  build-binaries:
    strategy:
      fail-fast: false
      matrix:
        # aarch64 runs the NEON kernels, x86_64 linux the AVX2 ones
        # (runtime-detected, scalar fallback below AVX2). The published
        # bench numbers are per-target; x86 numbers need their own run.
        #
        # One binary per target. The x86_64 one carries the AVX-512 kernels as
        # well, because kernel selection is a runtime CPU check: on a machine
        # without AVX-512 they are never chosen, which the x86 CI job proves by
        # running this build on an AVX2-only runner. The Cargo feature stays
        # opt-in for a different audience - building it needs Rust 1.89, above
        # the 1.88 MSRV promised to people compiling from source.
        include:
          - target: aarch64-apple-darwin
            runner: macos-latest
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            features: avx512
    runs-on: ${{ matrix.runner }}
    needs: [guard, test]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: build
        run: |
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            # Same bounded retry as build-artifacts.yml: an apt mirror that
            # stalls must not hang a release.
            for attempt in 1 2 3; do
              if timeout 180 sudo apt-get update \
                 && timeout 300 sudo apt-get install -y gcc-aarch64-linux-gnu; then
                installed=1
                break
              fi
              echo "apt attempt $attempt failed or timed out, retrying"
              sleep 15
            done
            if [ "${installed:-0}" != "1" ]; then
              echo "::error::could not install the aarch64 cross-linker"
              exit 1
            fi
            export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
          fi
          cargo build --release --target ${{ matrix.target }} \
            --bin skeg --bin skeg-resp3 -p skeg-server --locked \
            ${{ matrix.features && format('--features {0}', matrix.features) || '' }}
      - name: package
        run: |
          cd target/${{ matrix.target }}/release
          tar -czf skeg-${{ github.ref_name }}-${{ matrix.target }}.tar.gz skeg skeg-resp3
          shasum -a 256 skeg-${{ github.ref_name }}-${{ matrix.target }}.tar.gz > skeg-${{ github.ref_name }}-${{ matrix.target }}.tar.gz.sha256
      # Run artifact only; `promote-release` uploads them to the GitHub
      # Release once every target (and the image) has built.
      - uses: actions/upload-artifact@v5
        with:
          name: skeg-${{ github.sha }}-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/skeg-*.tar.gz
            target/${{ matrix.target }}/release/skeg-*.tar.gz.sha256

  # Build the multi-binary container image for ghcr.io.
  # The image bundles both `skeg` (native protocol, 7379) and
  # `skeg-resp3` (Redis-compat, 6379). Default entrypoint is `skeg`.
  # Built natively per architecture (arm64 + amd64 manifest); published tags:
  #   ghcr.io/skegdb/skeg:<version>   (e.g. 0.1.1)
  #   ghcr.io/skegdb/skeg:latest      (only on tag pushes)
  docker-build:
    # Builds both architectures and pushes them by digest only: untagged
    # candidates, invisible to `docker pull ghcr.io/skegdb/skeg:<anything>`.
    # docker-publish.yml no longer fires on `v*` by itself; `gated: true`
    # skips its test job (the identical one ran above on this commit) and a
    # manual run builds without pushing so a broken Dockerfile still
    # fails here.
    needs: [guard, test]
    uses: ./.github/workflows/docker-publish.yml
    with:
      stage: build
      gated: true
      dry_run: ${{ github.event_name != 'push' }}

  # ---- promotion: nothing above this line is public ----

  promote-release:
    # First public step. Runs only once every build succeeded; on a tag push
    # it creates the GitHub Release with every tarball at once.
    if: github.event_name == 'push'
    needs: [guard, test, build-binaries, docker-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: skeg-${{ github.sha }}-*
          merge-multiple: true
          path: dist
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/skeg-*.tar.gz
            dist/skeg-*.tar.gz.sha256

  docker-promote:
    # Binds the digests `docker-build` pushed under `:<version>` / `:latest`
    # (or the dispatch tag). Same call, `stage: promote`: no rebuild.
    if: github.event_name == 'push'
    needs: [promote-release]
    uses: ./.github/workflows/docker-publish.yml
    with:
      stage: promote
      gated: true

  # Custom one-shot brew bump. mislav's action stops working on the
  # second invocation because the version field is already at the
  # target ("Skipping: the formula is already at version X"), which
  # would leave the linux branch's sha256 stale. This job clones the
  # tap, rewrites `version`, the mac sha256, and the linux sha256 in
  # a single commit, then pushes. Both url lines are kept as the
  # `v#{version}` template, so only the version + the two checksums
  # ever need touching here.
  bump-homebrew:
    if: github.event_name == 'push'
    needs: [publish-crates]
    runs-on: ubuntu-latest
    env:
      FORMULA: Formula/skeg.rb
      DOWNLOAD_BASE: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}
      TARBALL_PREFIX: skeg-${{ github.ref_name }}
    steps:
      - name: fetch per-platform sha256 from the GitHub Release
        id: sha
        run: |
          set -eo pipefail
          MAC=$(curl -sL "${DOWNLOAD_BASE}/${TARBALL_PREFIX}-aarch64-apple-darwin.tar.gz.sha256" | awk '{print $1}')
          LINUX=$(curl -sL "${DOWNLOAD_BASE}/${TARBALL_PREFIX}-aarch64-unknown-linux-gnu.tar.gz.sha256" | awk '{print $1}')
          [ -n "$MAC" ] && [ -n "$LINUX" ] || { echo "missing sha256"; exit 1; }
          echo "mac=$MAC" >> "$GITHUB_OUTPUT"
          echo "linux=$LINUX" >> "$GITHUB_OUTPUT"
      - name: clone the tap
        env:
          TOKEN: ${{ secrets.HOMEBREW_GITHUB_API_TOKEN }}
        run: |
          set -eo pipefail
          git clone --depth=1 "https://x-access-token:${TOKEN}@github.com/skegdb/homebrew-tap.git" tap
      - name: rewrite version + per-platform sha256
        env:
          MAC_SHA: ${{ steps.sha.outputs.mac }}
          LINUX_SHA: ${{ steps.sha.outputs.linux }}
        run: |
          set -eo pipefail
          VERSION_NO_V="${GITHUB_REF_NAME#v}"
          python3 - "tap/${FORMULA}" "$VERSION_NO_V" "$MAC_SHA" "$LINUX_SHA" <<'PY'
          import re, sys
          path, version, mac_sha, linux_sha = sys.argv[1:5]
          lines = open(path).read().split('\n')
          state = None
          for i, line in enumerate(lines):
              stripped = line.strip()
              if re.match(r'if OS\.mac\?', stripped):
                  state = 'mac'
              elif re.match(r'elsif OS\.linux\?', stripped):
                  state = 'linux'
              elif stripped == 'end':
                  state = None
              if stripped.startswith('version "'):
                  lines[i] = re.sub(r'"[^"]*"', f'"{version}"', line, count=1)
              elif 'sha256 "' in line:
                  sha = mac_sha if state == 'mac' else linux_sha if state == 'linux' else None
                  if sha:
                      lines[i] = re.sub(r'sha256 "[^"]*"', f'sha256 "{sha}"', line, count=1)
          open(path, 'w').write('\n'.join(lines))
          PY
      - name: commit and push
        run: |
          set -eo pipefail
          cd tap
          git config user.name "skegdb-bot"
          git config user.email "bot@users.noreply.github.com"
          git add "$FORMULA"
          if git diff --cached --quiet; then
            echo "formula unchanged; nothing to commit"
            exit 0
          fi
          VERSION_NO_V="${GITHUB_REF_NAME#v}"
          git commit -m "skeg ${VERSION_NO_V}: bump version + aarch64 darwin/linux sha256"
          git push origin main
