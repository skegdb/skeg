name: Build artifacts

# On-demand build of release binaries for the 4 target platforms.
# Triggered manually from the GitHub UI (workflow_dispatch) or on every
# push to `main` (nightly-style). Artefacts uploaded to the workflow
# run page; not attached to any GitHub Release and not tagged on
# crates.io. Use this to smoke-test the build pipeline before tagging
# a real release.
#
# To produce signed/published artefacts, push a tag matching `v*` and
# the `release.yml` workflow takes over.

on:
  workflow_dispatch:
    inputs:
      version_suffix:
        description: "Suffix appended to the version label (e.g. nightly, rc1)"
        required: false
        default: "dev"
  push:
    branches: [main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # aarch64 (NEON) plus x86_64 linux (AVX2). See release.yml.
        include:
          - target: aarch64-apple-darwin
            runner: macos-latest
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: exact ecosystem candidate
        run: bash scripts/checkout-ecosystem.sh
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.target }}
      - name: cargo build
        run: |
          cargo build --release --locked \
            --target ${{ matrix.target }} \
            --bin skeg --bin skeg-resp3 -p skeg-server --features tenant-auth
      - name: package
        id: pkg
        env:
          VERSION_SUFFIX: ${{ github.event.inputs.version_suffix || 'dev' }}
        run: |
          SUFFIX="$VERSION_SUFFIX"
          [[ "$SUFFIX" =~ ^[a-zA-Z0-9_.-]{1,64}$ ]] || exit 1
          SHA="${GITHUB_SHA::7}"
          NAME="skeg-${SUFFIX}-${SHA}-${{ matrix.target }}"
          cd target/${{ matrix.target }}/release
          COPYFILE_DISABLE=1 tar -czf "${NAME}.tar.gz" skeg skeg-resp3
          shasum -a 256 "${NAME}.tar.gz" > "${NAME}.tar.gz.sha256"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
      - name: stateful artifact smoke
        run: |
          bash scripts/smoke-resp3-artifact.sh \
            --tarball "target/${{ matrix.target }}/release/${{ steps.pkg.outputs.name }}.tar.gz" \
            --require-clean --source-sha "$GITHUB_SHA" --evidence evidence/tarball-${{ matrix.target }}.json
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: always()
        with:
          name: evidence-${{ matrix.target }}
          path: evidence
      - name: upload workflow artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: ${{ steps.pkg.outputs.name }}
          path: |
            target/${{ matrix.target }}/release/skeg-${{ github.event.inputs.version_suffix || 'dev' }}-*-${{ matrix.target }}.tar.gz
            target/${{ matrix.target }}/release/skeg-${{ github.event.inputs.version_suffix || 'dev' }}-*-${{ matrix.target }}.tar.gz.sha256
          retention-days: 14
