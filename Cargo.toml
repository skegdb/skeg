[workspace]
members = [
    "crates/skeg-proto",
    "crates/skeg-core",
    "crates/skeg-simd",
    "crates/skeg-platform",
    "crates/skeg-vector",
    "crates/skeg-server",
    "crates/skeg-resp3",
    "crates/skeg-telemetry",
    "crates/skeg-tenant",
    "crates/skeg-server-tenant",
    "crates/skeg-multi-tenant",
    "crates/repo-audit",
]
# Fuzz targets live outside the workspace (own Cargo.toml). The
# `live-attach` feature of skeg-multi-tenant only resolves when the
# sibling skeg-rigging-net repo is available; build the crate without
# that feature in fresh checkouts.
exclude = ["fuzz"]
resolver = "2"

[workspace.package]
# Per-crate versioning: each crate sets its own `version` and is bumped
# only when its code changes. The workspace no longer carries a shared
# `version` field; release.yml diffs each crate's tree against the
# previous tag and skips `cargo publish` when nothing changed.
edition = "2024"
# Edition 2024 stabilised in 1.85; a few 1.86 niceties in use.
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/skegdb/skeg"
homepage = "https://github.com/skegdb/skeg"
authors = ["skeg contributors"]
description = "RAM-frugal KV + vector store for Personal AI inference machines"
keywords = ["vector-database", "kv-store", "personal-ai", "vamana", "ann"]
categories = ["database", "data-structures"]

[workspace.lints.rust]
# Allow muting lints that exist in newer rustc but not in MSRV
# stable. Without this, CI rustc (older than the dev toolchain) errors
# on the `clippy::manual_is_multiple_of` allow below as `unknown lint`.
unknown_lints = "allow"

[workspace.lints.clippy]
# Two lints muted because their stable/unstable status flips across
# the MSRV (1.88) and the toolchain newer contributors use. Keeping
# them as warn-only would make CI green on one and red on the other.
uninlined_format_args = "allow"   # 1.88 deny vs 1.93 noise; cosmetic
manual_is_multiple_of = "allow"   # 1.93 asks for `.is_multiple_of()` which is unstable < 1.87

# A parking_lot guard held across an `.await` is a hang, not a warning: the
# shard runs on a current_thread runtime, so the task that owns the guard is
# also the task that must make progress to release it. Introduced exactly
# this way once - `match vindexes.write().remove(name) { ... }` keeps the
# scrutinee guard alive for the whole match, and the miss arm awaited inside
# it. Ten minutes at 0.0% CPU. The compiler can hold this rule; a reviewer
# reliably cannot.
await_holding_lock = "deny"

[workspace.dependencies]
# Async
tokio = { version = "1", features = ["full"] }
# Already in the tree transitively; used directly for bounded concurrency over
# !Send futures (buffer_unordered), which tokio's JoinSet cannot express.
futures-util = { version = "0.3", default-features = false }

# Framing & bytes
bytes = "1"
bitflags = "2"

# Hashing & checksum
xxhash-rust = { version = "0.8", features = ["xxh3"] }
crc32c = "0.6"

# Sync
parking_lot = "0.12"

# Strutture
smallvec = { version = "1", features = ["union"] }
fixedbitset = "0.5"
ahash = "0.8"

# Float ordering
ordered-float = "4"

# Compressione

# Platform
libc = "0.2"
memmap2 = "0.9"
bytemuck = { version = "1", features = ["derive"] }

# Allocator (Consolidation Hygiene): jemalloc returns freed pages to the OS
# on a decay timer, so streaming-insert consolidation churn does not stay
# pinned in RSS the way it does with the system allocator.
tikv-jemallocator = "0.6"

# Random
rand = "0.9"

# Error / log
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Test
proptest = "1"
tempfile = "3"

# Bench
criterion = { version = "0.5", features = ["html_reports"] }

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
panic = "abort"

[profile.bench]
inherits = "release"
debug = true

# skeg-rigging-skeg (crates.io, used by skeg-multi-tenant) depends on
# `skeg-vector = "0.1"`. Without this patch the registry copy is resolved
# next to the workspace one and the multi-tenant crate embeds an engine
# this workspace never built or tested. Same for the crates it drags in.
[patch.crates-io]
# Bridge for the 0.8.0 convergence, not a release dependency. skeg-rigging-skeg
# 0.1.4 on crates.io requires skeg-vector ^0.1, which 0.2.0 cannot satisfy, so
# the registry copy would embed the previous engine next to this one (the
# P0.7 defect). skeg-rigging's feat/engine-0.2 branch requires skeg-vector 0.2;
# patching BOTH rigging crates here (not only in skeg-multi-tenant) replaces
# the registry copy for every consumer in the graph, including the optional
# live-attach chain (skeg-rigging-net*), so --all-features resolves to one
# skeg-rigging. skeg-multi-tenant is not published by the v0.8.0 tag; once
# skeg-rigging-skeg 0.1.5 (skeg-vector 0.2) is on crates.io these two lines
# go, and the next tag publishes it.
skeg-rigging = { git = "https://github.com/skegdb/skeg-rigging", rev = "2578dce4d63901e1bb11f775e495537b6b16fff2" }
skeg-rigging-skeg = { git = "https://github.com/skegdb/skeg-rigging", rev = "2578dce4d63901e1bb11f775e495537b6b16fff2" }
skeg-vector = { path = "crates/skeg-vector" }
skeg-simd = { path = "crates/skeg-simd" }
skeg-platform = { path = "crates/skeg-platform" }

# Loopback / cross-repo integration tests live in the skeg-testing
# repository (https://github.com/skegdb/skeg-testing). This workspace
# is fully self-contained.
