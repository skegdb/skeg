[package]
name = "skeg-simd"
version = "0.1.7"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "SIMD-accelerated distance kernels (NEON, scalar fallback) for skeg"
readme = "../../README.md"
keywords = ["simd", "neon", "vector", "distance", "skeg"]
categories = ["algorithms", "hardware-support"]

[dependencies]
thiserror = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
criterion = { workspace = true }

[[bench]]
name = "distances"
harness = false

[features]
# AVX-512 kernels (P4 Slice F): off by default. Runtime detection is
# mandatory regardless of this feature - it only controls whether the
# AVX-512 code exists in the binary at all. Validated on Zen 4 and Zen 5:
# see the coverage test for which kernels are dispatched and why.
avx512 = []

[lints]
workspace = true
