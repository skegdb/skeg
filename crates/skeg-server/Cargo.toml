[package]
name = "skeg-server"
version = "0.7.3"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "TCP server for skeg: thread-per-core, binary protocol + RESP3"
readme = "../../README.md"
keywords = ["vector-database", "tcp", "server", "skeg", "resp3"]
categories = ["database", "network-programming"]

[lib]
name = "skeg_server"
path = "src/lib.rs"

[[bin]]
name = "skeg"
path = "src/main.rs"

[[bin]]
name = "skeg-resp3"
path = "src/bin/skeg-server-resp3.rs"

[dependencies]
ahash = { workspace = true }
skeg-proto = { path = "../skeg-proto", version = "0.2" }
skeg-core = { path = "../skeg-core", version = "0.3.5" }
skeg-platform = { path = "../skeg-platform", version = "0.1.6" }
crc32c = { workspace = true }
skeg-vector = { path = "../skeg-vector", version = "0.1.9" }
skeg-resp3 = { path = "../skeg-resp3", version = "0.2.5" }
skeg-telemetry = { path = "../skeg-telemetry", version = "0.2" }
socket2 = "0.5"
tokio = { workspace = true }
futures-util = { workspace = true }
bytes = { workspace = true }
xxhash-rust = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tikv-jemallocator = { workspace = true }
parking_lot = { workspace = true }
opentelemetry = { version = "0.32", optional = true }
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio"], optional = true }
opentelemetry-otlp = { version = "0.32", features = ["grpc-tonic"], optional = true }
tracing-opentelemetry = { version = "0.33", optional = true }

[features]
# HTTP Prometheus exporter is on by default so the released binary
# serves `/metrics` out of the box when `--metrics-port <PORT>` is
# passed. Drop it with `--no-default-features`; the `--metrics-port`
# flag stays parseable but logs a warning instead of binding.
default = ["metrics-http", "tracing-otlp"]
avx512 = ["skeg-vector/avx512"]
# Typed write-path failpoints (see `src/failpoint.rs`). Off in a normal
# build: `fp!` then expands to a type annotation and the write path carries
# no branch. Turned on for this crate's own tests through the dev-dependency
# below, which is how `tests/*.rs` - separate crates, so `cfg(test)` does not
# reach the library - get to arm them.
failpoints = ["skeg-vector/failpoints"]
metrics-http = ["skeg-telemetry/http"]
# OpenTelemetry tracing exporter. When this feature is on AND the env
# var `SKEG_TRACE_OTLP_ENDPOINT` is set, spans flow to the configured
# OTLP/gRPC collector. When the feature is off, the OTel crates are
# not linked.
tracing-otlp = [
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:tracing-opentelemetry",
]

[dev-dependencies]
tokio = { workspace = true }
tempfile = { workspace = true }
# The crate itself, with failpoints on. An integration test is its own crate
# and links the library through this entry, so `cargo test -p skeg-server`
# builds the tested library WITH the failpoints while `cargo build` does not.
#
# Feature unification makes that wider than it looks: under `cargo test
# --workspace` the feature is on for every workspace consumer of this crate,
# not only for its own tests. Confined to the test profile - a release build
# resolves without this entry - but it is why `fp!` has to be correct when
# enabled, not merely absent when not.
skeg-server = { path = ".", features = ["failpoints"] }

[[bench]]
name = "tracing_overhead"
harness = false

# Does erasing a tenant scale with the tenant, or with the whole keyspace?
[[bench]]
name = "erase_tenant_scaling"
harness = false

[[bench]]
name = "vindex_admin_scaling"
harness = false

# Tenant erasure on real embeddings: does a survivor come through untouched?
[[bench]]
name = "erase_real_embeddings"
harness = false

[lints]
workspace = true
