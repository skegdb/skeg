[package]
name = "skeg-server-tenant"
version = "0.3.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Compatibility shim: the multi-tenant profile now lives in skeg-server behind its tenant-auth feature"
readme = "../../README.md"
keywords = ["multi-tenant", "server", "skeg"]
categories = ["database"]

[lib]
name = "skeg_server_tenant"
path = "src/lib.rs"

[dependencies]
skeg-server = { path = "../skeg-server", version = "0.8", features = ["tenant-auth"] }
skeg-tenant = { path = "../skeg-tenant", version = "0.1.3" }
skeg-vector = { path = "../skeg-vector", version = "0.2" }
skeg-platform = { path = "../skeg-platform", version = "0.1.6" }

tokio = { workspace = true }
parking_lot = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tikv-jemallocator = { workspace = true }

[features]
avx512 = ["skeg-server/avx512", "skeg-vector/avx512"]

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
